[project]
name = "LitFlow"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
  "flask",
  "authlib",
  "celery",
  "redis",
  "python-dotenv",
  "surya-ocr==0.6.13",
  "transformers<4.45.0",
  "pdf2image",
  "gunicorn",
  "requests",
  "torch",
  "torchvision",
]

# Pull torch from the CPU-only PyTorch index.
# This gives a ~200 MB wheel instead of 500 MB + 1.5 GB of nvidia-* CUDA packages.
# Required because surya-ocr depends on torch and we run SURYA_CPU_ONLY=true.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
