<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — LitFlow</title>
  <meta name="description" content="Sign in to LitFlow with your institutional account." />
  <link href="https://cdn.jsdelivr.net/npm/flowbite@2/dist/flowbite.min.css" rel="stylesheet" />
  <style>
    body {
      background: radial-gradient(ellipse at 60% 0%, #2d1b69 0%, #0f0f1a 60%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-10">
      <div class="bg-purple-700 bg-opacity-30 rounded-full p-5 mb-4 ring-2 ring-purple-600">
        <svg class="w-10 h-10 text-purple-300" fill="none" stroke="currentColor" stroke-width="1.8"
             viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987
                   8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0
                   016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018
                   18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">LitFlow</h1>
      <p class="text-gray-400 mt-1 text-sm">Scanned Islamic book OCR portal</p>
    </div>

    <!-- Card -->
    <div class="bg-gray-900 border border-gray-700 rounded-2xl shadow-2xl p-8 text-center">
      <h2 class="text-lg font-semibold text-gray-100 mb-2">Sign in to continue</h2>
      <p class="text-sm text-gray-400 mb-8">
        Authentication is handled securely via Pocket-ID (OIDC).
      </p>

      <a href="{{ url_for('auth.login') }}"
         id="login-btn"
         class="w-full inline-flex items-center justify-center gap-3 px-6 py-3.5
                bg-purple-600 hover:bg-purple-500 active:bg-purple-700
                text-white font-semibold rounded-xl transition-all duration-200
                shadow-lg shadow-purple-900/40">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25
                   2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12
                   9l-3 3m0 0l3 3m-3-3h12.75"/>
        </svg>
        Sign in with Pocket-ID
      </a>
    </div>

    <p class="text-center text-xs text-gray-600 mt-6">
      LitFlow &mdash; Phase 1
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@2/dist/flowbite.min.js"></script>
</body>
</html>
